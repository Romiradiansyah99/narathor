[project]
name = "narathor"
version = "0.1.0"
description = "Mesin perangkai naskah short dari pustaka video sebuah channel YouTube"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.13",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "youtube-transcript-api>=0.6",
    "yt-dlp>=2024.10.0",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
trace = ["langfuse>=2.50"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "pyright>=1.1",
]

[project.scripts]
narathor = "narathor.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["narathor", "backend", "agent", "search"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --cov --cov-report=term-missing --cov-fail-under=80"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:backend.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.pyright]
include = ["backend", "agent", "narathor", "soul", "briefs", "index", "ingest", "search", "contracts.py"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.coverage.run]
source = ["backend", "agent", "narathor", "soul", "briefs", "index", "ingest", "search", "contracts.py"]
omit = ["data/*", "tests/*"]
